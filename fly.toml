# Fly.io config. One machine in Sydney that stops when nobody is connected. See docs/deploy.md.
app = "anwealso-mahjong"
primary_region = "syd"

[http_service]
  internal_port = 8080
  force_https = true
  # Stop when there are no connections (open game sockets count), start again on the next request.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    grace_period = "5s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
